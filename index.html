<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axil Persona Music</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      background: linear-gradient(135deg, #7b2cff, #e91e63);
      padding: 40px 20px;
    }

    h1 {
      font-size: 36px;
      margin: 0;
    }

    header p {
      font-size: 18px;
    }

    .music {
      margin: 25px auto;
      padding: 20px;
      max-width: 500px;
      background: #222;
      border-radius: 15px;
    }

    audio {
      width: 100%;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎵 Axil Persona Music</h1>
    <p>Minhas músicas, minha voz, minha história.</p>
  </header>

  <div class="music">
    <h2>Amor Não Vá</h2>
    <audio controls>
      <source src="amor-nao-va.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="music">
    <h2>Glória a Deus</h2>
    <audio controls>
      <source src="gloria-a-deus.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="music">
    <h2>O Que Deu em Você</h2>
    <audio controls>
      <source src="o-que-deu-em-voce.mp3" type="audio/mpeg">
    </audio>
  </div>

</body>
</html>
